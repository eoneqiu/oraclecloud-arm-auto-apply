name: Auto Clean Releases and Workflows

on:
  workflow_dispatch:
    inputs:
      number:
        description: 'Number of latest releases to keep'
        required: false
        default: '3'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # 👇 按照官方文档推荐，声明所需的写权限
    permissions:
      contents: write # 删除 Release 和 Tag 所需
      actions: write  # 删除 Workflow 运行记录所需
      
    steps:
      # ==========================================
      # 1. Token 验证步骤（放在最前面，报错就跑不到后面了）
      # ==========================================
      - name: Verify Token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 错误：GH_TOKEN 是空的，请检查 MY_PAT 是否配置正确！"
            exit 1
          else
            echo "✅ 成功：GH_TOKEN 已成功注入！"
            echo "Token 长度: ${#GH_TOKEN}" # 打印长度，既安全又能确认非空
          fi
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}

      # ==========================================
      # 2. 核心清理步骤（按官方示例传参）
      # ==========================================
      - name: Delete old releases and workflows
        uses: ophub/delete-releases-workflows@main
        with:
          # 👇 核心修复：按照官方示例，将 token 直接作为 with 的参数传入
          gh_token: ${{ secrets.MY_PAT }} 
          
          # ⚠️ 请确认这里写的是你要清理的目标仓库（如果当前仓库就是这个，可以删掉这行）
          repo: eoneqiu/oraclecloud-arm-auto-apply 
          
          delete_releases: true
          releases_keep_latest: ${{ github.event.inputs.number || 3 }}
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
