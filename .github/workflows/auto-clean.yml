name: Auto Clean Releases and Workflows

on:
  workflow_dispatch:
    inputs:
      number:
        description: 'Number of latest releases to keep'
        required: false
        default: '3'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # 1. 先验证 Secret 是否存在于仓库中（已验证成功，保留作防备）
      - name: Verify Secret
        run: |
          if [ -z "${{ secrets.MY_PAT }}" ]; then
            echo "❌ 错误：Secret MY_PAT 为空！"
            exit 1
          else
            echo "✅ 成功：Secret MY_PAT 存在！"
          fi

      # 2. 执行清理
      - name: Delete old releases and workflows
        uses: ophub/delete-releases-workflows@main
        # 👇 核心修复：必须将 env 写在这里（步骤级别），而不是放在 jobs 下方
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        with:
          # 请确认这里写的是你真正要清理的仓库
          repo: eoneqiu/oraclecloud-arm-auto-apply 
          delete_releases: true
          releases_keep_latest: ${{ github.event.inputs.number || 3 }}
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
