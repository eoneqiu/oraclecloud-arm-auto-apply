name: Auto Clean Releases and Workflows

on:
  workflow_dispatch:
    inputs:
      number:
        description: 'Number of latest releases to keep'
        required: false
        default: '3'

# 强制赋予 GITHUB_TOKEN 写权限，这是在 YAML 层面最稳妥的做法
permissions:
  contents: write  # 删除 Release 和 Tag 所需
  actions: write   # 删除 Workflow 运行记录所需

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases and workflows
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: ${{ github.event.inputs.number || 3 }}
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
        env:
          # 使用默认的 Token，名称必须是 GH_TOKEN
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
